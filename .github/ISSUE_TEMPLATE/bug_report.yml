name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Expected behavior, actual behavior, and steps to reproduce. Remove operational or personal data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: DockSlot revision, browser, PostgreSQL/Node versions, timezone, and installation method.
